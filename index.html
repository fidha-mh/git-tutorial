<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>My Simple Website</title>
   <style>
       body {
           font-family: Arial, Helvetica, sans-serif;
           margin: 0;
           padding: 0;
       }
       .header {
           padding: 20px;
           text-align: center;
           background: #1abc9c;
           color: white;
       }
       .navbar {
           display: flex;
           justify-content: center;
           background-color: #333;
       }
       .navbar a {
           padding: 14px 20px;
           display: block;
           color: white;
           text-align: center;
           text-decoration: none;
       }
       .navbar a:hover {
           background-color: #ddd;
           color: black;
       }
       .content {
           padding: 20px;
       }
       .footer {
           padding: 10px;
           text-align: center;
           background: #ddd;
       }
   </style>
</head>
<body>
   <div class="header">
       <h1>Welcome hello</h1>
       <p>A simple website created by me.</p>
   </div>
   <div class="navbar">
       <a href="#home">Home</a>
       <a href="#about">About</a>
       <a href="#services">Services</a>
       <a href="#contact">Contact</a>
   </div>
   <div class="content">
       <h2>Home</h2>
       <p>This is the home page of my simple website. Here you can find information about me and my services.</p>
   </div>
   <div class="footer">
       <p>© 2023 My Simple Website</p>
   </div>
</body>
</html>
